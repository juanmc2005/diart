[project]
name = "diart"
version = "0.9.2"
description = "A python framework to build AI for real-time speech"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Juan Manuel Coria" },
]
keywords = [
    "speaker diarization",
    "streaming",
    "online",
    "real time",
    "rxpy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10,<3.13"

dependencies = [
    "einops>=0.3.0",
    "matplotlib>=3.3.3,<4.0.0",
    "numpy>=1.20.2,<2.0.0",
    "optuna>=2.10",
    "pandas>=1.4.2",
    "pyannote.audio==3.4.0",
    "pyannote.core==5.0.0",
    "pyannote.database==5.1.3",
    "pyannote.metrics==3.2.1",
    "rich>=12.5.1",
    "rx>=3.2.0",
    "scipy>=1.6.0",
    "sounddevice>=0.4.2",
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "torchvision==0.22.1",
    "tqdm>=4.64.0",
    "websocket-client>=0.58.0",
    "websocket-server>=0.6.4",
    "huggingface-hub==0.36.2",
    "lightning==2.6.1",
    "lightning-fabric==2.6.1",
    "pyannote.pipeline==3.0.1",
    "requests>=2.31.0",
    "setuptools<81",
    "whisper-timestamped==1.15.9",
]

[project.urls]
Homepage = "https://github.com/juanmc2005/diart"
Repository = "https://github.com/juanmc2005/diart"

[project.scripts]
"diart.stream" = "diart.console.stream:run"
"diart.benchmark" = "diart.console.benchmark:run"
"diart.tune" = "diart.console.tune:run"
"diart.serve" = "diart.console.serve:run"
"diart.client" = "diart.console.client:run"

# --- uv-specific configuration ---
# Pin torch packages to the PyTorch CUDA 12.8 index so `uv sync` / `uv pip install`
# resolves the cu128 wheels instead of the default CPU wheels.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=7.4.0,<8.0.0",
    "onnxruntime==1.18.0",
]
